services:
  - type: web
    name: fraud-detection-api
    runtime: python
    buildCommand: apt-get install -y tesseract-ocr && pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.13